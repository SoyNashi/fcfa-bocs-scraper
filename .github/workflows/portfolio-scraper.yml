name: Portfolio Scraper (LinkedIn)

on:
  workflow_dispatch:  # solo manual, tú lo lanzas cuando actualices el JSON

jobs:
  portfolio:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Deploy portfolio.json a gh-pages sin borrar nada
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

          git clone --branch gh-pages --single-branch \
            "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            gh-pages-dir

          cp portfolio.json gh-pages-dir/portfolio.json

          cd gh-pages-dir
          git add portfolio.json
          git diff --cached --quiet && echo "Sin cambios" || \
            git commit -m "Actualizar portfolio"
          git push origin gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
