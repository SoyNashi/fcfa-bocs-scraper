name: FCFA Scraper

on:
  schedule:
    - cron: '0 6 * * 1'  # lunes 06:00 UTC
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper
        run: python scraper.py

      - name: Deploy partidos.json a gh-pages sin borrar nada
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

          # Clonar SOLO la rama gh-pages en una carpeta separada
          git clone --branch gh-pages --single-branch \
            "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            gh-pages-dir

          # Copiar solo partidos.json, sin tocar portfolio.json ni nada más
          cp partidos.json gh-pages-dir/partidos.json

          cd gh-pages-dir
          git add partidos.json
          git diff --cached --quiet && echo "Sin cambios, nada que commitear" || \
            git commit -m "Actualizar partidos"
          git push origin gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
